<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Himanshu Naik · Backend & AI Engineer</title>
    <meta name="description" content="Himanshu Naik, backend and AI engineer in Pune. AI agents, RAG systems and the backend services they run on.">

    <!-- Preview card when the link is shared (WhatsApp, LinkedIn, X...) -->
    <meta property="og:title" content="Himanshu Naik · Backend & AI Engineer">
    <meta property="og:description" content="AI agents, RAG systems and the backend services they run on.">
    <meta property="og:image" content="https://www.himanshunaik.dev/assets/images/pfp.jpg">

    <link rel="icon" type="image/png" href="/assets/logo/bat-160.png">

    <!-- Monospace font for small labels (dates, shortcut keys) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Apply the saved theme BEFORE the page paints, so light-mode visitors
         don't see a dark flash while React is still loading. -->
    <script>
        if (localStorage.getItem("theme") === "light") {
            document.documentElement.dataset.theme = "light";
        }
    </script>
</head>

<body>
    <!-- React puts the whole site inside this div (see src/main.jsx) -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
