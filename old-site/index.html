<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BATMAN</title>

    <link rel="icon" type="image/png" href="assets/logo/bat.png">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <!-- Profile -->
        <img
            class="profile-picture"
            src="assets/images/pfp.png"
            alt="Profile picture"
        >

        <div class="intro">

            <div class="name">
                <h1>Himanshu Naik</h1>
            </div>

            <p class="role">Software Engineer</p>

        </div>

        <p class="bio">
            I am a full-time software engineer.<br>
            Part time I try to learn anything that can help me
            to leave my full-time job ;)
        </p>


        <!-- Work -->
        <section class="work">

            <h2>WORK</h2>

            <a href="https://www.upswing.cloud/" class="work-item" target="_blank" rel="noopener noreferrer">

                <img
                    src="assets/images/upswing.png"
                    alt="Upswing"
                >

                <div class="work-info">
                    <h3>Upswing - Cognitive Hospitality Solutions</h3>
                    <p>Hotel Booking Agent</p>
                </div>

                <span class="arrow">↗</span>

            </a>

        </section>

    </main>

    <script src="js/script.js"></script>

</body>

</html>
